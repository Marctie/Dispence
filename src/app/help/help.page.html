<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/settings"></ion-back-button>
    </ion-buttons>
    <ion-title>Guida e FAQ</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-accordion-group class="faq-list">
    @for (faq of faqs; track faq.question) {
      <ion-accordion [value]="faq.question">
        <ion-item slot="header">
          <ion-label class="ion-text-wrap">{{ faq.question }}</ion-label>
        </ion-item>
        <div class="faq-answer" slot="content">
          {{ faq.answer }}
        </div>
      </ion-accordion>
    }
  </ion-accordion-group>
</ion-content>
